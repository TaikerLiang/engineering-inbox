[project]
name = "engineering-inbox"
version = "0.1.0"
description = "Local-first personal review inbox for GitLab issues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
inbox = "engineering_inbox.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_inbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
